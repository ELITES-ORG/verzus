name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests, builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build API, venue dashboard and landing page
        run: pnpm --filter @verzus/api --filter @verzus/venue --filter @verzus/site build
      - name: Build player PWA
        run: pnpm --filter @verzus/player build
        env:
          # Build-time placeholders only; real values are set on Render.
          EXPO_PUBLIC_SUPABASE_URL: http://localhost:55421
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          EXPO_PUBLIC_API_URL: http://localhost:8787

  database:
    name: Migrations, RLS tests, API integration test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@v3
        with:
          version: 2.121.0
      - run: pnpm install --frozen-lockfile
      - name: Start Postgres and apply migrations + seed
        run: supabase db start
      - name: Database tests (pgTAP)
        run: supabase test db
      - name: Check generated types are up to date
        run: |
          supabase gen types typescript --local --schema public > packages/db-types/src/database.types.ts
          git diff --exit-code packages/db-types/src/database.types.ts
      - name: API integration test
        run: pnpm --filter @verzus/api test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55422/postgres
