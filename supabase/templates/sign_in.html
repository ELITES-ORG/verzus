<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#f6f5fb;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f5fb;padding:32px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border:3px solid #1d1a4a;">
            <tr>
              <td style="background:#1d1a4a;padding:18px 28px;font:700 24px/1 Arial,Helvetica,sans-serif;color:#ffffff;letter-spacing:-0.5px;">
                <span style="color:#22c55e;">v</span>erzus
              </td>
            </tr>
            <tr>
              <td style="padding:28px;font:16px/1.55 Arial,Helvetica,sans-serif;color:#1d1a4a;">
                <p style="margin:0 0 18px;">Your sign-in code:</p>
                <p style="margin:0 0 22px;font:700 34px/1 'Courier New',Courier,monospace;letter-spacing:8px;color:#1d1a4a;">{{ .Token }}</p>
                <p style="margin:0 0 22px;">Type it on the sign-in page. It works for one hour.</p>
                <p style="margin:0 0 26px;">
                  Or, on the device where you asked for it,
                  <a href="{{ .ConfirmationURL }}" style="color:#15803d;font-weight:700;">sign in with this link</a>.
                </p>
                <p style="margin:0;font-size:13px;color:#6f6a9c;">Didn't ask for this? You can ignore this email. Nobody can sign in without the code or link in it.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
